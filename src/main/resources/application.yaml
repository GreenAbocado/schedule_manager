spring:
  application:
    name: schedulemanager
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/schedule
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    root: info
    com.greenabocado.schedulemanager: debug
    org.hibernate.SQL: debug

---

운영 환경 프로필 (datasource 및 ddl-auto, 로깅 레벨 수정)